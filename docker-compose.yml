# MealPlanner — home deployment stack. One `docker compose up -d` runs the whole app behind
# HTTPS on the home network. Caddy terminates TLS using a Cloudflare Origin Certificate and
# proxies to the Blazor web front-end, which reaches the API by the `api` service name via
# Aspire service discovery configuration.
services:
  api:
    build:
      context: .
      dockerfile: src/MealPlanner.Api/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0-dev}
    image: ghcr.io/cam96/mealplanner-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # The database and rotating pre-migration backups live on named volumes, never the
      # container's writable layer, so data survives rebuilds and updates.
      ConnectionStrings__mealplanner: Data Source=/data/mealplanner.db
      MealPlanner__BackupDirectory: /backups
      # CNF nutrition search: point the API at the bundled dataset.
      MealPlanner__CnfDirectory: /data/cnf
      # Set to true on a fresh install to load representative demo data (off by default).
      MealPlanner__SeedDemoData: "false"
      # JWT authentication — must match the key used by the web service.
      Authentication__Jwt__Key: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    volumes:
      - mealplanner-data:/data
      - mealplanner-backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: src/MealPlanner.Web/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0-dev}
    image: ghcr.io/cam96/mealplanner-web:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Aspire service discovery: resolve the "api" client base address to the api container.
      services__api__http__0: http://api:8080
      # Authentication: Google OAuth + JWT signing key (must match the api service key).
      Authentication__Jwt__Key: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy — TLS termination with Cloudflare Origin Certificate.
  # Only service with a published port; web and api are internal-only.
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mealplanner-data:
  mealplanner-backups:
  caddy-data:
