name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0 or 1.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.VERSION }}" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MealPlanner.Api/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: mealplanner-api:${{ steps.version.outputs.VERSION }}
          outputs: type=docker,dest=mealplanner-api-${{ steps.version.outputs.VERSION }}.tar

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MealPlanner.Web/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: mealplanner-web:${{ steps.version.outputs.VERSION }}
          outputs: type=docker,dest=mealplanner-web-${{ steps.version.outputs.VERSION }}.tar

      - name: Compress images
        run: |
          gzip mealplanner-api-${{ steps.version.outputs.VERSION }}.tar
          gzip mealplanner-web-${{ steps.version.outputs.VERSION }}.tar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE == 'true' }}
          name: v${{ steps.version.outputs.VERSION }}
          files: |
            mealplanner-api-${{ steps.version.outputs.VERSION }}.tar.gz
            mealplanner-web-${{ steps.version.outputs.VERSION }}.tar.gz
