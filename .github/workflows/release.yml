name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0 or 1.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Determine pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.VERSION }}" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MealPlanner.Api/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mealplanner-api:${{ steps.version.outputs.VERSION }}
            ${{ steps.prerelease.outputs.IS_PRERELEASE == 'false' && format('ghcr.io/{0}/mealplanner-api:latest', github.repository_owner) || '' }}
          push: true

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MealPlanner.Web/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mealplanner-web:${{ steps.version.outputs.VERSION }}
            ${{ steps.prerelease.outputs.IS_PRERELEASE == 'false' && format('ghcr.io/{0}/mealplanner-web:latest', github.repository_owner) || '' }}
          push: true

      - name: Export images as tar archives
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/mealplanner-api:${{ steps.version.outputs.VERSION }}
          docker pull ghcr.io/${{ github.repository_owner }}/mealplanner-web:${{ steps.version.outputs.VERSION }}
          docker save ghcr.io/${{ github.repository_owner }}/mealplanner-api:${{ steps.version.outputs.VERSION }} \
            | gzip > MealPlanner-Api-${{ steps.version.outputs.VERSION }}.tar.gz
          docker save ghcr.io/${{ github.repository_owner }}/mealplanner-web:${{ steps.version.outputs.VERSION }} \
            | gzip > MealPlanner-Web-${{ steps.version.outputs.VERSION }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE == 'true' }}
          name: v${{ steps.version.outputs.VERSION }}
          files: |
            MealPlanner-Api-${{ steps.version.outputs.VERSION }}.tar.gz
            MealPlanner-Web-${{ steps.version.outputs.VERSION }}.tar.gz
