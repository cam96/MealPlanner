name: PR Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit & Integration Tests
        run: dotnet test tests/MealPlanner.Tests/MealPlanner.Tests.csproj --no-build --verbosity normal

      - name: Install Playwright browsers
        run: pwsh tests/MealPlanner.AcceptanceTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Acceptance Tests
        run: dotnet test tests/MealPlanner.AcceptanceTests/MealPlanner.AcceptanceTests.csproj --no-build --verbosity normal
